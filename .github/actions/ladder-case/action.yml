name: One case of the published ladder
description: >
  Measure one case on one sink, and upload what it produced before anything else
  can take the box.

inputs:
  sink:
    description: highs or gurobi
    required: true
  case:
    description: one of the published cases
    required: true
  memory-budget:
    description: GB a cell may take before its arm stops climbing; blank is the published value
    required: false
    default: ''
  sizes:
    description: rungs to measure; blank is the published ladder. A short list is how a change is proven end to end without spending hours on the rungs that are hard to hold.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BENCH_MEMORY_BUDGET: ${{ inputs.memory-budget }}
        BENCH_SIZES: ${{ inputs.sizes }}
        SINK: ${{ inputs.sink }}
        CASE: ${{ inputs.case }}
      run: pixi run -e bench ladder-ci "$SINK" "$CASE"

    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ inputs.sink }}-${{ inputs.case }}-${{ github.run_id }}
        path: bench/results
        retention-days: 90
