name: Sweep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/2', '1/2']
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-sweep-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-sweep-${{ runner.os }}-
      - name: Every expression to depth three, on both lanes
        run: pixi run sweep ${{ matrix.shard }}
