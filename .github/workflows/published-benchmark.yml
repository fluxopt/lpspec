name: Published benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'published: the whole ladder, hours. smoke: one rung, minutes.'
        type: choice
        options: [published, smoke]
        default: published
      sizes:
        description: 'Rungs to measure. Blank is the published ladder; "xs s m" is a short run that proves the pipeline in minutes.'
        type: string
        default: ''
      memory_budget:
        description: 'GB a cell may take before its arm stops climbing. Blank uses the published value; a lower one is a diagnostic run that completes and reports what each cell actually took.'
        type: string
        default: ''

jobs:
  provision:
    name: bring the box up
    runs-on: ubuntu-24.04
    if: vars.BENCH_RUNNER != ''
    steps:
      - uses: hetznercloud/setup-hcloud@v2
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
          SNAPSHOT: ${{ vars.BENCH_SNAPSHOT }}
          TYPE: ${{ vars.BENCH_SERVER_TYPE || 'ccx33' }}
          LOCATION: ${{ vars.BENCH_LOCATION || 'nbg1' }}
          SSH_KEY: ${{ vars.BENCH_SSH_KEY }}
        run: |
          hcloud server delete "$BOX" 2>/dev/null || true
          hcloud server create --name "$BOX" --image "$SNAPSHOT" --type "$TYPE" \
            --location "$LOCATION" ${SSH_KEY:+--ssh-key "$SSH_KEY"} --start-after-create

  benchmark:
    needs: provision
    if: ${{ !cancelled() && needs.provision.result != 'failure' }}
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A warmed box carries a pixi binary that setup-pixi refuses to overwrite.
      - run: rm -f ~/.pixi/bin/pixi
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      # Committed results would publish as this run's; a case it could not measure stays a gap.
      - run: rm -f bench/results/latest*.json

      - if: inputs.mode == 'smoke'
        run: pixi run -e bench ladder-smoke
      # One step per case, so each uploads its results before a dying runner skips the rest.
      - if: inputs.mode != 'smoke'
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: transport
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: storage
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: fleet
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: transport
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: storage
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: fleet
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}

      - if: ${{ !cancelled() }}
        run: pixi run -e bench report
      - if: ${{ !cancelled() }}
        run: pixi run -e bench plot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-benchmark-${{ github.run_id }}
          path: |
            bench/results
            docs/about/benchmarks.md
            docs/about/benchmarks-scaling.html
          retention-days: 90

  teardown:
    name: take the box down
    needs: [provision, benchmark]
    if: always() && vars.BENCH_RUNNER != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: hetznercloud/setup-hcloud@v2
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
        run: |
          if hcloud server describe "$BOX" >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              hcloud server delete "$BOX" && break
              echo "delete failed, retry $attempt"; sleep 15
            done
          fi
          hcloud primary-ip delete "$BOX" 2>/dev/null || true
          hcloud server list
          hcloud primary-ip list
