name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the changelog headings
        run: python3 -m tools.changelog check

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false

      # No pixi.lock exists, so the cache keys on pyproject.toml and the solve runs fresh.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-suite-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-suite-${{ runner.os }}-

      - run: pixi install -e default
      - run: pixi run lint
      - run: pixi run format-check
      # `github` is the output format, so findings land as annotations on the diff.
      - run: pixi run typecheck github
      - run: pixi run test

      # `test` does not reach the bench tests (#1185, #1245).
      - run: pixi run test-bench

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-docs-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-docs-${{ runner.os }}-

      # The retry and timeout are for a slow apt mirror that killed four runs on 2026-08-19.
      - name: A minimal TeX
        run: |
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update -qq && break
            echo "apt-get update did not finish in 120s (attempt $attempt of 3)"
          done
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            texlive-latex-base texlive-fonts-recommended

      - run: pixi install -e docs

      - run: pixi run docs-build

      - run: pixi run docs-test

      - name: Every model renders to LaTeX that compiles
        run: |
          mkdir -p "$RUNNER_TEMP/tex"
          pixi run -e docs python - "$RUNNER_TEMP/tex" \
            examples/*.yaml examples/ports/*.yaml <<'PY'
          import sys
          from pathlib import Path

          from mathspec.__main__ import main

          out, models = Path(sys.argv[1]), sys.argv[2:]
          for model in models:
              name = Path(model).stem
              argv = ['latex', model, '--standalone', '-o', str(out / f'{name}.tex')]
              symbols = Path('examples/symbols', f'{name}.yaml')
              if symbols.is_file():
                  argv += ['--symbols', str(symbols)]
              main(argv)
          PY
          printf '%s\0' "$RUNNER_TEMP"/tex/*.tex |
            xargs -0 -P "$(nproc)" -n1 pdflatex -halt-on-error \
              -interaction=nonstopmode -output-directory "$RUNNER_TEMP/tex"

  floors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-floors-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-floors-${{ runner.os }}-
      - run: pixi run test-floors

  ci:
    needs: [suite, docs, floors]
    # Without `always()`, a failed job skips this check, and a pull request merges over a skip.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
