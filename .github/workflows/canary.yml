name: mathspec canary

on:
  schedule:
    # Off the hour, because runs scheduled at :00 queue behind everyone else's cron.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false

      # `--with` overrides the mathspec pin for this run only, which a pixi environment cannot.
      - name: the suite, against mathspec at main
        run: >
          pixi exec -s uv uv run
          --with "mathspec @ git+https://github.com/energy-models/mathspec@main"
          pytest -q -n auto
