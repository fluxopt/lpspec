name: Bench

on:
  pull_request:
    types: [labeled]

env:
  SELECT: >-
    --sizes s m
    --cases dispatch nodal transport profiled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # to take the label off again when the run is done
  pull-requests: write

jobs:
  bench:
    if: github.event.label.name == 'trigger:bench'
    runs-on: ubuntu-24.04
    # Two passes of SELECT; at 20 minutes run 34720933380 died inside the baseline pass.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base commit has to be reachable to check out
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      - name: warm the data cache
        run: |
          pixi run -e bench python - <<'PY'
          from bench.cases import CASES

          for case in ('dispatch', 'nodal', 'transport', 'profiled'):
              for size in ('s', 'm'):
                  CASES[case].data(CASES[case].shape(size))
          PY

      # Only src/ from the base, so a harness change cannot read as a performance change.
      - name: baseline — the engine as it is on the base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- src/
          pixi run -e bench pytest bench $SELECT --benchmark-memory --benchmark-autosave -q
          git checkout ${{ github.event.pull_request.head.sha }} -- src/

      - name: this PR's engine
        run: pixi run -e bench pytest bench $SELECT --benchmark-memory --benchmark-autosave -q

      - name: report
        if: always()
        run: |
          {
            echo '## Benchmarks: base → this PR'
            echo
            pixi run -e bench benchmem compare .benchmarks/*/0001_*.json .benchmarks/*/0002_*.json \
              --columns peak,rss,time --diff --format md
            echo
            echo '`peak` is memray'"'"'s allocator high-water mark and is deterministic — it is what the gate reads.'
            echo '`rss` and `time` are reported but never gated: a shared runner'"'"'s wall clock and page cache are noise.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Peak only, at 20%: identical code spreads up to 16%, real changes moved peak 40-60%.
      - name: gate
        run: |
          pixi run -e bench benchmem compare .benchmarks/*/0001_*.json .benchmarks/*/0002_*.json \
            --columns peak --fail-on peak:20%

      # Best-effort: a fork PR's token is read-only, and housekeeping must not fail the run.
      - name: hand the label back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label 'trigger:bench' || true
