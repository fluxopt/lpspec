name: Release

# A release is a merged pull request that puts a version heading, such as
# `## 0.1.0 (2026-10-01)`, above everything else in CHANGELOG.md. On that
# merge this workflow tags the commit, opens the GitHub release with the
# section as its notes, builds the wheel from the tag and publishes it to PyPI.
# Every other push to main finds no untagged version and does nothing.
# See RELEASING.md.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version the changelog names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pending.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags are what tells a new version from one already released.
          fetch-depth: 0
          persist-credentials: false

      - id: pending
        name: Read the version to release
        run: echo "version=$(python3 -m tools.changelog pending)" >> "$GITHUB_OUTPUT"

      # `gh release create --target` makes the tag on the server, at the
      # commit this run is for. A pre-release version is marked as one, so it
      # never shows as the latest release.
      - name: Tag and open the GitHub release
        if: steps.pending.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m tools.changelog notes "$VERSION" > notes.md
          flags=()
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md "${flags[@]}"

  build:
    name: Build
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}
          fetch-depth: 0  # hatch-vcs reads the tag; a shallow clone yields a .dev version
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false

      # `pixi exec` rather than an environment of its own: this is a one-off
      # tool, run once per release, and nothing else in the tree needs a build
      # backend on hand. The wheel is `py3-none-any`, so which interpreter runs
      # the build decides nothing about what ships.
      - run: pixi exec --spec python-build --spec python=3.12 python -m build

      - name: Verify the built version is the released one
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          pixi exec --spec packaging --spec python=3.12 python - <<'PY'
          import os, pathlib, sys
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          version = Version(os.environ['VERSION'])
          wheels = sorted(pathlib.Path('dist').glob('*.whl'))
          sdists = sorted(pathlib.Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f'expected one wheel and one sdist in dist/, found {[p.name for p in wheels + sdists]}')
          built = {parse_wheel_filename(wheels[0].name)[1], parse_sdist_filename(sdists[0].name)[1]}
          if built != {version}:
              sys.exit(
                  f'the changelog releases {version}, but dist/ holds {sorted(map(str, built))}. '
                  'Usually means the tag was not fetched (shallow clone) or the tree is dirty.'
              )
          print(f'ok: {wheels[0].name} and {sdists[0].name} are {version}')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The trusted publisher on PyPI names this workflow and this environment.
    # A required reviewer on the environment is the last point a release can
    # be stopped: PyPI never takes a version twice.
    environment:
      name: pypi
      url: https://pypi.org/project/specsolve/${{ needs.tag.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
