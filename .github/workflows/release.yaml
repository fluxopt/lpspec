name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Release line to run against (e.g. a 0.1.x maintenance branch). Defaults to main.'
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.target-branch || github.ref_name }}
  cancel-in-progress: false

# secrets are not readable from a step-level `if`, so hoist the check here
env:
  HAS_RELEASE_APP: ${{ secrets.APP_CLIENT_ID != '' }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Warn when falling back to GITHUB_TOKEN
        if: env.HAS_RELEASE_APP != 'true'
        run: |
          echo "::warning::APP_CLIENT_ID is unset — using GITHUB_TOKEN. The release PR will not run CI. See RELEASING.md."

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ inputs.target-branch || 'main' }}

      # Auto-merge, because the required checks have not reported on the just-updated PR yet.
      - name: Merge the release PR when CI passes (temporary, alpha only)
        if: vars.AUTO_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # this job never checks out, so gh has no remote to infer the repo from
          GH_REPO: ${{ github.repository }}
          BASE: ${{ inputs.target-branch || 'main' }}
        run: |
          set -euo pipefail
          read -r pr version < <(
            gh pr list --state open --base "$BASE" --json number,title,headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                    | first
                    | select(. != null)
                    | "\(.number) \(.title | split(" ") | last)"'
          ) || true

          if [[ -z "${pr:-}" ]]; then
            echo "no open release PR against $BASE — nothing to release"
            exit 0
          fi

          if [[ "$version" != *-* ]]; then
            echo "::notice::#$pr releases $version — the first official version is not automatic. Merge it yourself (RELEASING.md)."
            exit 0
          fi

          echo "enabling auto-merge on #$pr ($version) — temporary alpha-stream policy, see RELEASING.md"
          gh pr merge "$pr" --squash --auto
