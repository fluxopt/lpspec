name: PR title

# The squash subject becomes a commit on main. The PR adds its title to
# CHANGELOG.md by hand, and its type decides whether it owes that line. Nothing
# writes the changelog on merge. See RELEASING.md.
#
# Merges are squash-only (repo ruleset), and `squash_merge_commit_title` is
# COMMIT_OR_PR_TITLE: GitHub uses the PR title when a PR has several commits, and
# the single commit's own title when it has exactly one. So both are validated —
# whichever GitHub picks, it has been checked. (Setting the repo to PR_TITLE makes
# it unconditionally the PR title; this check stays correct either way.)

on:
  pull_request:
    # `synchronize` is here because this check is **required**, and a required
    # check is evaluated against the head commit. Skipping the push event does
    # not mean "reuse the previous result" — it means the new head has *no*
    # result, and GitHub waits for one that will never arrive. The PR is then
    # blocked with nothing to click on: not a failing check, an absent one.
    #
    # That is what happened to #269 — opened, pushed to, then stuck at
    # `mergeStateStatus: BLOCKED` for hours with every visible check green. It
    # was reported as CI hanging, which is exactly how it looks.
    #
    # It was dropped to save a job per push, and that reasoning was sound while
    # the check was advisory. Once it gates the merge queue, an unreported run
    # is indistinguishable from an unfinished one, and no amount of waiting
    # resolves it. Cost: one ~5s job per push, billed as a minute.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional commit subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the subject that will land on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail

          # keep in sync with the type table in AGENTS.md and CONTRIBUTING.md
          TYPES='feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert'
          # type, optional (scope), optional ! for breaking, ": ", then a subject
          PATTERN="^(${TYPES})(\([a-z0-9._/-]+\))?!?: .+"

          fail=0

          check() {
            local what="$1" subject="$2"
            if [[ ! "$subject" =~ $PATTERN ]]; then
              echo "::error::${what} is not a conventional commit subject: ${subject}"
              fail=1
              return
            fi
            if (( ${#subject} > 72 )); then
              echo "::warning::${what} is ${#subject} chars; git and the GitHub UI truncate around 72."
            fi
            echo "ok: ${what} — ${subject}"
          }

          # A one-commit PR is squashed with that commit's own title, so both
          # the PR title and that title are checked.
          titles=("PR title|${PR_TITLE}")
          if [[ "$COMMIT_COUNT" == "1" ]]; then
            only=$(gh api "repos/${REPO}/pulls/${NUMBER}/commits" --jq '.[0].commit.message')
            titles+=("the single commit's title|$(head -1 <<<"$only")")
          fi

          for entry in "${titles[@]}"; do
            check "${entry%%|*}" "${entry#*|}"
          done

          if (( fail )); then
            cat <<EOF

          Expected: <type>[(scope)][!]: <subject>

            types    ${TYPES//|/, }
            examples feat: streaming engine for indexed constraints
                     fix(parser): where clauses with a trailing comma
                     refactor(api): closed helper set, no monkey-patch

          Fix the PR title — no need to rewrite the branch. Edits re-run this check.
          EOF
            exit 1
          fi
