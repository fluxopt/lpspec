# Quarterly and grouped on purpose; security updates do not follow this cadence.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      hooks:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
