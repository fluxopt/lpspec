repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local, so pyrefly checks against the pixi environment and not pre-commit's own venv.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly check
        entry: pixi run typecheck
        language: system
        types_or: [python, pyi]
        pass_filenames: false  # pyrefly reads project-includes from pyproject.toml
        require_serial: true
