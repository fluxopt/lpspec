              - storage units: examples/pypsa_storage.md
              - cyclic storage: examples/pypsa_cyclic_storage.md
              - Kirchhoff's voltage law: examples/pypsa_kvl.md
              - transmission losses: examples/pypsa_losses.md
              - AC-DC, two coordinates: examples/pypsa_ac_dc.md
              - unit commitment: examples/pypsa_unit_commitment.md
