      - Sweeps and rolling horizons: reference/sweeps.md
      - The data contract: reference/data.md
      - Glossary: reference/glossary.md
      # The language is a dependency and is documented with itself.
      - The language: https://mathspec.readthedocs.io/en/latest/reference/language/
      - Examples:
          - examples/index.md
          - Teaching examples:
              - dispatch: examples/dispatch.md
              - storage: examples/storage.md
              - transport: examples/transport.md
              - piecewise: examples/piecewise.md
              - piecewise segment lines: examples/piecewise_lp.md
