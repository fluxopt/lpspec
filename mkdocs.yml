site_name: lpspec
site_description: Self-documenting optimisation models — declarative LP/MILP, built relationally and handed straight to the solver
site_url: https://lpspec.readthedocs.io/en/latest/
repo_url: https://github.com/fluxopt/lpspec
repo_name: fluxopt/lpspec
edit_uri: edit/main/docs/
strict: true

# `docs/` is the site *and* what contributors read on GitHub, so every page here
# is a file that already had to make sense on its own. Two consequences:
#
#   - `README.md` stays as the folder view GitHub renders when you browse to
#     `docs/`, and `index.md` does that job on the site. zensical builds no page
#     from a `README.md` and still validates its links, so this one obeys the
#     rule below like every other page rather than being exempted from it.
#   - A link to something *outside* `docs/` is written as a full GitHub URL, not
#     as `../CONTRIBUTING.md` — the site has no such file, and a relative link
#     would resolve in the repo and 404 here. `tests/test_docs_site.py` enforces
#     both halves of that. Everything inside `docs/` stays relative and the
#     build validates it.

validation:
  # Under `strict: true` a warning is a failed build, which is the point: a
  # model page added without a nav entry, or a link that stopped resolving,
  # fails CI rather than shipping.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  # Arranged by what a page is for — tutorial, how-to guide, reference,
  # explanation (https://diataxis.fr). `.claude/skills/docs-writing/SKILL.md`
  # says how one kind is told from another, and the folders under `docs/`
  # follow the same split. The model pages and the ladder are reference in
  # their own form, and sit at the end of the Reference section, after the
  # four pages a reader looks things up in.
  - Tutorials:
      - Run a model: guide.md
      - Change a model: interactive.md
      - Fix, relax, remove: lifecycle.md
  - How-to guides:
      - Preparing the data: howto/data.md
      # The schema is the language's, so the editor recipe is documented with it.
      - Editor completion and offline checking: https://math-spec.readthedocs.io/en/latest/howto/installation/#editor-completion-and-offline-checking
      - Running a sweep in parallel: howto/parallel.md
      - Archiving a solve: howto/archiving.md
      - Reading a directory of runs: howto/warehouse.md
      - Debugging a wrong answer: howto/debug.md
  - Reference:
      - The verbs: reference/api.md
      - Sweeps and rolling horizons: reference/sweeps.md
      - The data contract: reference/data.md
      - Glossary: reference/glossary.md
      # The language is a dependency and is documented with itself.
      - The language: https://math-spec.readthedocs.io/en/latest/reference/language/
      - Examples:
          - examples/index.md
          - Teaching examples:
              - dispatch: examples/dispatch.md
              - storage: examples/storage.md
              - transport: examples/transport.md
              - piecewise: examples/piecewise.md
              - piecewise segment lines: examples/piecewise_lp.md
              - piecewise curves of differing length: examples/piecewise_ragged.md
              - piecewise conversion: examples/piecewise_conversion.md
              - special-ordered sets: examples/sos.md
              - monthly budget: examples/monthly_budget.md
              - multi-period: examples/multi_period.md
              - seasons: examples/seasons.md
              - reserves: examples/reserves.md
              - walkthrough: examples/walkthrough.md
          - PyPSA examples:
              - transport model: examples/pypsa_transport.md
              - ramp limits: examples/pypsa_ramp.md
              - storage units: examples/pypsa_storage.md
              - cyclic storage: examples/pypsa_cyclic_storage.md
              - Kirchhoff's voltage law: examples/pypsa_kvl.md
              - transmission losses: examples/pypsa_losses.md
              - AC-DC, two coordinates: examples/pypsa_ac_dc.md
              - unit commitment: examples/pypsa_unit_commitment.md
              - minimum up and down times: examples/pypsa_min_up_down.md
              - linearized unit commitment: examples/pypsa_linearized_uc.md
              - global limits: examples/pypsa_global_limits.md
              - multi-link: examples/pypsa_multilink.md
              - modular capacity: examples/pypsa_modular.md
              - energy totals: examples/pypsa_energy_sum.md
              - fixed by data: examples/pypsa_fixed.md
              - spillage: examples/pypsa_spill.md
              - the Store component: examples/pypsa_store.md
              - mixed cycling: examples/pypsa_mixed_cycling.md
              - link delay: examples/pypsa_link_delay.md
              - multi-period investment: examples/pypsa_multi_period.md
              - committable and extendable: examples/pypsa_committable_extendable.md
              - growth limit: examples/pypsa_growth_limit.md
              - stochastic scenarios: examples/pypsa_stochastic.md
              - CVaR risk preference: examples/pypsa_cvar.md
          - Published optima:
              - Dantzig transport: examples/transport_dantzig.md
              - Dantzig, economies of scale: examples/transport_pwl.md
              - Stigler's diet: examples/stigler_diet.md
              - Facility location: examples/facility_location.md
              - GenX piecewise fuel: examples/genx_piecewise_fuel.md
              - Routing telephone calls: examples/telephone_routing.md
              - Choosing the mode of transport: examples/transport_modes.md
              - OSeMOSYS UTOPIA: examples/osemosys_utopia.md
              - Travelling salesman: examples/tsp_mtz.md
      - The PyPSA ladder:
          - examples/pypsa_ladder.md
          - Rung 1: examples/pypsa_ladder/rung_01_transport.md
          - Rung 2: examples/pypsa_ladder/rung_02_storage.md
          - Rung 3: examples/pypsa_ladder/rung_03_expansion.md
          - Rung 4: examples/pypsa_ladder/rung_04_ramps.md
          - Rung 5: examples/pypsa_ladder/rung_05_global_constraints.md
          - Rung 6: examples/pypsa_ladder/rung_06_kvl.md
          - Rung 7: examples/pypsa_ladder/rung_07_commitment.md
          - Rung 8: examples/pypsa_ladder/rung_08_modular_big_m.md
          - Rung 9: examples/pypsa_ladder/rung_09_multilink.md
          - Rung 10: examples/pypsa_ladder/rung_10_quadratic_costs.md
          - Rung 11: examples/pypsa_ladder/rung_11_ac_dc_meshed.md
          - Rung 12: examples/pypsa_ladder/rung_12_linearized_uc.md
          - Rung 13: examples/pypsa_ladder/rung_13_losses.md
          - Rung 14: examples/pypsa_ladder/rung_14_stochastic.md
          - Rung 15: examples/pypsa_ladder/rung_15_multi_period.md
          - Rung 16: examples/pypsa_ladder/rung_16_link_delay.md
  # Everything a reader does not need in order to write or run a model: design
  # notes, measured cost, project direction. One section, so the user path
  # above stays the whole of the top level.
  - About:
      - about/index.md
      - Architecture: about/architecture.md
      - Decomposition: about/decomposition.md
      # The results themselves: charts and their numbers, one page. A source
      # file rather than a generated one — mkdocs copies it through and the nav
      # links it like any other — because the charts are hand-written SVG and
      # only the `const DATA` line inside it is mechanical.
      - Benchmarks: about/benchmarks-scaling.html
      # How those numbers were taken, and what is not measured. Separate because
      # a reader comparing libraries and a reader checking the method want
      # different pages, and putting both in one made the first scroll past the
      # second.
      - Benchmarks — method: about/benchmarks.md
      - Relationship to linopy: about/linopy.md
      - Prior art and credit: about/prior-art.md
      - Roadmap: about/roadmap.md
      - Changelog: about/changelog.md

theme:
  name: material
  language: en

  palette:
    # Dark first = default for new visitors (no auto/system-pref entry).
    # Icon represents the CURRENT scheme — moon when active is dark,
    # sun when active is light. The `name` describes the toggle action.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Roboto
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # navigation.instant left off — MathJax fails to re-typeset on
    # no-math → math swaps, and no documented reset recipe fixes it.
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's slug rules, not mkdocs'. The pages here are read in both
      # places and already cross-link by anchor — `ROADMAP.md#track-4--sink-
      # capabilities`, whose double hyphen is the em dash GitHub drops. The
      # default slugifier collapses that to one, so every such link would 404
      # on the site while working in the repo. Same file, same anchor, both
      # renderings.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # README and ARCHITECTURE both draw the lane diagram in mermaid.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # A ```math fence is how GitHub takes block math verbatim, and is what
        # math-spec's typesetter prints into every generated page here.
        # Arithmatex reads `$$…$$`, so the fence hands it over — indented inside
        # a tab or a list included, which is why this is superfences' job and
        # not the hook's regex.
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format { kwds: { which: generic } }
  - pymdownx.details
  # `check_paths` so a renamed include fails the build rather than rendering as
  # nothing. `docs/index.md` pulls four named sections of the README through
  # this, and `docs/about/changelog.md` is the whole of CHANGELOG.md. It is what
  # retired mkdocs-include-markdown-plugin, which zensical does not run.
  - pymdownx.snippets:
      check_paths: true
  # The other half of the math, beside the `arithmatex` entry above: the
  # verbatim `$`…`$` pair math-spec's typesetter prints for GitHub, rewritten
  # into the `$…$` arithmatex reads. It is a preprocessor rather than a hook
  # because zensical has no hooks, and because the suite can then load it
  # without a site.
  - tools.mdx_github_math
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # `docs/interactive.md` and `docs/lifecycle.md` hold their code in
  # `python exec="true"` blocks, which markdown-exec runs during the build. So
  # every number, frame and rendered equation on those two pages came from the
  # code above it, on the commit being built, and a block that raises fails the
  # build — which is what stops a page from teaching a call that no longer
  # works. It is the same bargain mkdocs-jupyter's `execute: true` struck for
  # the notebooks these pages replaced, without a kernel and without a second
  # copy of the tutorial in the tree.
  #
  # Execution needs the package importable, which is why `.readthedocs.yaml`
  # installs the project and the `docs` environment carries it.
  - markdown-exec

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fluxopt/lpspec
      name: lpspec on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/lpspec/
      name: lpspec on PyPI

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

watch:
  - docs
  - README.md
  - CHANGELOG.md
