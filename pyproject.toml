[build-system]
# 1.27 is the first hatchling with PEP 639 license fields.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "specsolve"
dynamic = ["version"]
description = "Self-documenting optimisation models: declarative LP/MILP, built relationally and handed straight to the solver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "optimisation", "optimization", "linear-programming", "mixed-integer",
    "declarative", "yaml", "polars", "highs", "operations-research",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mathspec>=0.1.0",
    "polars>=1.30",
    "numpy>=1.26",
    # 1.13 is the first highspy with the bulk `changeRowsBounds`.
    "highspy>=1.13",
]

[project.optional-dependencies]
xarray = [
    "xarray>=2024.2.0",
    "pandas>=2.2",
]
gurobi = [
    # 11 is the release whose status codes the sink maps.
    "gurobipy>=11",
    "scipy>=1.11",
]
xpress = [
    # 9.5 is the release that renamed the read-back to `getDuals` and `getSlacks`.
    "xpress>=9.5",
]

[project.urls]
repository = "https://github.com/fluxopt/specsolve"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/specsolve"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[dependency-groups]
bench = [
    # 0.5 is the first release that reports `rss` correctly on Linux.
    "pytest-benchmem>=0.5.5",
]
codspeed = [
    # Exact: CodSpeed compares across commits, so the plugin version is part of the measurement.
    "pytest-codspeed==5.0.3",
    "pandas>=2.2",
    "pyarrow>=16",
]
docs = [
    "zensical==0.0.62",
    "markdown-exec==1.12.3",
    "pymdown-extensions==11.0.1",
    "pygments==2.20.0",
    "pytest==9.1.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.1",
    "pyrefly==1.2.0",
    "pre-commit==4.6.1",
    # The test oracle (tests/linopy_lane). Master: linopy's v1 arithmetic
    # convention is in no release yet (#463).
    "linopy @ git+https://github.com/PyPSA/linopy@master",
    "pyarrow>=16",
    "typst>=0.15.0",
    "pyomo>=6.7",
]

# ---------------------------------------------------------------------------
# pixi — the environments, and one name per command
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
# linux-aarch64 is for CodSpeed's ARM64 runner.
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]
# `choices` on a task argument arrived in 0.65.
requires-pixi = ">=0.65"

# There is no pixi.lock: a lock would pin the oracle's linopy branch to one commit.

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
specsolve = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
specsolve = { path = ".", editable = true, extras = ["xarray", "gurobi", "xpress"] }

[tool.pixi.feature.floors]
# pyyaml has no win-64 wheel. linux-aarch64 lets `pixi install` solve on the CodSpeed runner.
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.floors.dependencies]
python = "3.12.*"

# Each pin is the floor `[project.dependencies]` declares; tests/test_tooling_pins.py checks it.
[tool.pixi.feature.floors.pypi-dependencies]
specsolve = { path = "." }
polars = "==1.30"
numpy = "==1.26"
highspy = "==1.13"
mathspec = "==0.1.0"
pytest = "*"
pytest-xdist = "*"

[tool.pixi.environments]
default = ["dev"]
docs = ["docs"]
bench = ["dev", "bench"]
codspeed = ["codspeed"]
floors = { features = ["floors"], no-default-feature = true }

[tool.pixi.tasks]
test = { cmd = "pytest -q -n auto", description = "The suite, across cores" }
test-bench = { cmd = "pytest bench/test_harness.py -q", description = "The harness measures what it says it measures" }
lint = { cmd = "ruff check .", description = "Lint" }
format = { cmd = "ruff format .", description = "Format in place" }
format-check = { cmd = "ruff format --check .", description = "Formatting has not drifted" }

[tool.pixi.tasks.typecheck]
description = "Types, over the package and the linopy reference scripts"
args = [{ arg = "format", default = "min-text", choices = [
    "min-text", "full-text", "full-text-with-github", "json", "github", "junit-xml",
    "code-climate", "omit-errors",
] }]
cmd = """
pyrefly check --output-format={{ format }} &&
pyrefly check --output-format={{ format }} -c examples/ports/references/linopy/pyrefly.toml examples/ports/references/linopy
"""

[tool.pixi.tasks.check]
description = "Everything the required check runs: lint, format, types, suite"
depends-on = ["lint", "format-check", "typecheck", "test"]

[tool.pixi.tasks.sweep]
description = "Every expression to depth three, both lanes"
args = [{ arg = "shard", default = "0/1" }]
cmd = "pytest tests/test_expression_sweep.py -q -n auto --sweep-depth 3 --sweep-shard {{ shard }}"

# `python -m` puts the project root on sys.path, which `tools.mdx_github_math` needs.
[tool.pixi.feature.docs.tasks]
docs = { cmd = "python -m zensical serve", description = "The site at 127.0.0.1:8000, live-reloading" }
docs-build = { cmd = "python -m zensical build --strict", description = "The site, built the way CI builds it" }
docs-test = { cmd = "pytest tests/test_docs_math.py -q", description = "The site's math, rendered — what a strict build does not check" }

[tool.pixi.feature.bench.tasks]
density = { cmd = "pytest bench --benchmark-memory --sizes d100 d50 d25 d08 --benchmark-json=bench/results/density.json", description = "The density sweep" }
declarations = { cmd = "pytest bench --benchmark-memory --sizes n002 n008 n032 n128 n008m n128m --benchmark-json=bench/results/declarations.json", description = "The declaration-count sweep, dense and masked" }
report = { cmd = "python -m bench.report --write", description = "Write every table into its fence in docs/about/benchmarks.md. Drop --write to print instead" }
plot = { cmd = "python -m bench.plot", description = "The figures, and the chart page's numbers" }
table = { cmd = "python -m bench.tidy bench/results", description = "Every measurement as one long CSV on stdout; --runs for the fingerprint" }

[tool.pixi.feature.bench.tasks.ladder]
description = "Every model the page publishes, in every library that can express it"
args = [
    { arg = "cases", default = "dispatch transport storage fleet" },
    { arg = "sizes", default = "xs s m l w1 w10 w100 w1000" },
    { arg = "sinks", default = "highs gurobi" },
    { arg = "arms", default = "specsolve linopy pyomo gurobipy-loop gurobipy-matrix highspy-matrix" },
    { arg = "out", default = "bench/results/latest.json" },
    { arg = "builds", default = "5" },
    { arg = "memory", default = "16" },
]
cmd = """
pytest bench --benchmark-memory --builds {{ builds }} \
  --cases {{ cases }} \
  --sizes {{ sizes }} --sinks {{ sinks }} --arms {{ arms }} \
  --budget 30 --memory-budget {{ memory }} --benchmark-memory-repeats 1 \
  --benchmark-json={{ out }}
"""

[tool.pixi.feature.bench.tasks.ladder-ci]
description = "One sink of the published ladder, a process per case"
args = [{ arg = "sink" }, { arg = "cases", default = "dispatch transport storage fleet" }]
# `bash -c` because the pixi shell has no `for`.
# `--builds` only on highs, because `test_rebuild` does not vary by sink.
cmd = '''bash -c 'bash bench/memory-watchdog.sh & watchdog=$!; trap "kill $watchdog 2>/dev/null || true" EXIT; memory="${BENCH_MEMORY_BUDGET:-16}"; sizes="${BENCH_SIZES:-xs s m l w1 w10 w100 w1000}"; builds=0; lost=""; [ "{{ sink }}" = highs ] && builds=5; for case in {{ cases }}; do pixi run -e bench ladder "$case" "$sizes" "{{ sink }}" "specsolve linopy pyomo gurobipy-loop gurobipy-matrix highspy-matrix" "bench/results/latest-{{ sink }}-$case.json" "$builds" "$memory" || lost="$lost $case"; done; [ -z "$lost" ] || { echo "cases that did not finish:$lost"; exit 1; }' '''

[tool.pixi.feature.bench.tasks.ladder-smoke]
description = "One rung, to prove the machinery rather than to measure anything"
depends-on = [
    { task = "ladder", args = [
        "xs",
        "highs",
        "specsolve linopy",
        "bench/results/latest-smoke.json",
    ] },
]

[tool.pixi.feature.bench.tasks.refresh]
description = "Re-measure the published ladder and rewrite the tables and the chart page"
depends-on = ["ladder", "density", "declarations", "report", "plot"]

[tool.pixi.feature.floors.tasks]
test-floors = { cmd = "python -c \"import importlib.util as u, sys; sys.exit(u.find_spec('linopy') is not None)\" && pytest -q -n auto", description = "The suite on the shipped shape, at the declared floors" }

[tool.ruff]
target-version = "py312"
line-length = 120
# Generated pages that embed committed files verbatim.
extend-exclude = ["docs/examples/pypsa_ladder"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "N",
    "UP",
    "FA",
    "TC",
    "SIM",
    "RUF",
    "PERF",
    "C4",
    "PIE",
    "RET",
    "FLY",
    "FURB",
    "T20",
    "T10",
    "PLC",
    "PLE",
    "D",
]
ignore = [
    "E501",     # the formatter owns line length
    "RET504",
    "PLC0415",  # lazy imports are load-bearing here
    "D1",       # AGENTS.md decides where a docstring earns its place
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
# T20: these files report by printing. D: the docstring rules gate src/ only.
"examples/**/*.py" = ["T20", "D"]
"docs/**/*.md" = ["T20"]
"bench/**/*.py" = ["T20", "D"]
"tools/**/*.py" = ["T20", "D"]
"differential/**/*.py" = ["T20", "D"]
"tests/**/*.py" = ["D"]
"tests/typeset/golden/__main__.py" = ["T20", "D"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["benchmem: pytest-benchmem settings for a benchmark (bench/, needs --group bench)"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["specsolve"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src/specsolve", "tests/linopy_lane"]
# The test oracle imports itself as `tests.linopy_lane`, from the repository root.
search-path = ["src", "."]
preset = "strict"

[tool.pyrefly.errors]
# `@abstractmethod` and tests/test_architecture.py already hold overrides to their base.
missing-override-decorator = false
explicit-any = true
implicit-import = true
missing-import = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
unknown-name = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unresolvable-dunder-all = true
untyped-import = true
unused-ignore = true
variance-mismatch = true

# These trees hold objects of libraries that publish no types this package can name.
[[tool.pyrefly.sub-config]]
matches = "tests/linopy_lane/**"
errors = { explicit-any = false }

[[tool.pyrefly.sub-config]]
matches = "src/specsolve/relational/sinks/solvers/**"
errors = { explicit-any = false }

